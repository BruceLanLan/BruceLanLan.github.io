  <main id="top">
    <section class="hero">
      <canvas id="sky" aria-hidden="true"></canvas>
      <div class="wrap hero-grid">
        <div class="hero-text">
          <p class="kicker"><span class="star-dot"></span><span data-i="kicker"></span></p>
          <h1><span class="h1a" data-i="h1a"></span><span class="h1b" data-i="h1b"></span></h1>
          <p class="lede" data-i="lede"></p>
          <div class="cta">
            <a class="btn primary" href="#research" data-i="ctaResearch"></a>
            <a class="btn" id="x-link" target="_blank" rel="noopener"><span data-i="ctaX"></span> ↗</a>
            <a class="btn" id="gh-link" target="_blank" rel="noopener"><span data-i="ctaGh"></span> ↗</a>
          </div>
          <ul class="roles" id="roles"></ul>
        </div>

        <aside class="toy" aria-label="NAND toy">
          <div class="toy-head"><span class="silk">No. 00 · NAND</span><b data-i="toyTitle"></b></div>
          <p class="toy-hint" data-i="toyHint"></p>
          <div class="gates" id="gates" role="tablist"></div>
          <div class="board">
            <div class="inputs">
              <button class="sw" data-in="a" aria-pressed="false"><span>A</span><i></i></button>
              <button class="sw" data-in="b" aria-pressed="false"><span>B</span><i></i></button>
            </div>
            <svg class="wire" viewBox="0 0 120 80" aria-hidden="true"><path id="wire-a" d="M0 20 H40 C60 20 60 40 80 40 H120"/><path id="wire-b" d="M0 60 H40 C60 60 60 40 80 40"/></svg>
            <div class="chip"><b id="gate-name">NAND</b><small id="gate-count"></small></div>
            <svg class="wire out" viewBox="0 0 60 80" aria-hidden="true"><path id="wire-o" d="M0 40 H60"/></svg>
            <div class="lamp" id="lamp"><i></i><small data-i="toyOut"></small></div>
          </div>
          <table class="truth" id="truth"></table>
        </aside>
      </div>

      <div class="cartouche" aria-hidden="true"><span class="ct-title" data-i="cartouche"></span></div>

      <svg class="great-wave" viewBox="0 0 1440 330" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="g-wave" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color: var(--wave-hi)" /><stop offset="1" style="stop-color: var(--wave-lo)" />
          </linearGradient>
          <linearGradient id="g-back" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color: var(--wave-back)" /><stop offset="1" style="stop-color: var(--wave-lo)" />
          </linearGradient>
          <linearGradient id="g-mtn" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color: var(--mountain-hi)" /><stop offset="1" style="stop-color: var(--mountain)" />
          </linearGradient>
          <!-- 油画质感：笔刷毛边 + 厚涂光影 -->
          <filter id="oil" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.03 0.08" numOctaves="2" seed="4" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" result="d" />
            <feTurbulence type="fractalNoise" baseFrequency="0.55 0.9" numOctaves="3" seed="9" result="fine" />
            <feDiffuseLighting in="fine" surfaceScale="2.2" lighting-color="#ffffff" result="light"><feDistantLight azimuth="235" elevation="48" /></feDiffuseLighting>
            <feComposite in="light" in2="d" operator="in" result="lit" />
            <feComposite in="d" in2="lit" operator="arithmetic" k1="0.95" k2="0.22" k3="0" k4="0" />
          </filter>
        </defs>

        <!-- 霞云（kasumi） -->
        <g class="kasumi">
          <rect x="40" y="176" width="380" height="18" rx="9" /><rect x="200" y="200" width="260" height="13" rx="6.5" />
          <rect x="1060" y="150" width="330" height="18" rx="9" /><rect x="1150" y="174" width="220" height="13" rx="6.5" />
        </g>

        <!-- 远山，山脊铺着走线 -->
        <g class="mtn" filter="url(#oil)">
          <path class="m-body" d="M150 250 L300 128 Q318 114 336 128 L500 250 Z" />
          <path class="m-snow" d="M300 128 Q318 114 336 128 L362 150 L346 146 L334 160 L320 148 L306 162 L294 148 L278 150 Z" />
          <path class="trace" d="M318 160 V196 H350 V232" /><circle class="pad" cx="318" cy="160" r="3.5" /><circle class="pad" cx="350" cy="232" r="3.5" />
          <path class="trace" d="M300 176 V210 H262 V240" /><circle class="pad" cx="300" cy="176" r="3.5" /><circle class="pad" cx="262" cy="240" r="3.5" />
        </g>

        <!-- 后浪 -->
        <path class="w-back" filter="url(#oil)" d="M0 214 C120 186 240 222 360 200 C470 180 520 150 600 166 C700 186 760 214 860 206 C1000 194 1120 170 1240 186 C1320 196 1380 190 1440 182 V330 H0Z" />

        <!-- 主浪：卷起的浪头 -->
        <g class="w-main" filter="url(#oil)">
          <path class="w-mid" id="curl" d="M0 330 L0 268 C120 254 240 266 360 256 C470 246 540 214 610 168 C680 122 760 86 850 82 C950 78 1022 128 1012 184 C1005 221 967 236 942 221 C920 208 927 181 950 182 C934 156 894 156 877 188 C858 226 892 266 962 272 C1100 284 1260 256 1440 266 L1440 330 Z" />
          <!-- 浪里的纹路 = 电路走线 -->
          <path class="trace w" d="M300 300 C420 292 520 262 600 214 C660 178 712 146 760 128" /><circle class="via" cx="760" cy="128" r="4" />
          <path class="trace w" d="M360 312 C470 304 560 272 640 226 L700 190 H760 V168" /><circle class="via" cx="760" cy="168" r="4" />
          <path class="trace w" d="M460 322 C560 316 640 286 700 252 H800 V214" /><circle class="via" cx="800" cy="214" r="4" />
          <path class="trace w" d="M820 112 C880 104 940 120 962 150" /><circle class="via" cx="820" cy="112" r="3.5" />
          <path class="trace w" d="M640 300 H760 C820 300 860 290 900 284" /><circle class="via" cx="900" cy="284" r="3.5" />
          <path class="trace w" d="M1060 300 C1160 292 1260 280 1380 286" /><circle class="via" cx="1060" cy="300" r="3.5" />
        </g>
        <g class="w-foam" id="foam"></g>

        <!-- 芯片小船 -->
        <g class="boat" transform="translate(1150 262) rotate(-8)">
          <rect x="-30" y="-9" width="60" height="18" rx="2" /><path d="M-22 -9v-6M-10 -9v-6M2 -9v-6M14 -9v-6M-22 9v6M-10 9v6M2 9v6M14 9v6" /><text x="0" y="4">NAND</text>
        </g>
        <g class="boat small" transform="translate(470 246) rotate(10)">
          <rect x="-20" y="-7" width="40" height="14" rx="2" /><path d="M-12 -7v-5M0 -7v-5M12 -7v-5M-12 7v5M0 7v5M12 7v5" />
        </g>

        <!-- 前浪 -->
        <path class="w-front" d="M0 304 C200 288 420 318 640 302 C860 286 1080 314 1300 300 C1360 296 1400 298 1440 302 V330 H0Z" />
      </svg>
    </section>

    <section class="section wrap" id="lab">

    <div class="seigaiha" aria-hidden="true"></div>

    <section class="section wrap split" id="log">

    <section class="section wrap" id="all">
      <details class="all">
        <summary><span class="idx">柒</span><h2 data-i="secAll"></h2><span class="count" id="repo-count"></span></summary>
        <div class="repo-list" id="repos"></div>
      </details>
    </section>
  </main>
